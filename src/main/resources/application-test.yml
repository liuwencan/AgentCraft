# 新增：Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics,info
      base-path: /actuator
  endpoint:
    prometheus:
      access: unrestricted
    health:
      show-details: always
  metrics:
    tags:
      application: agentcraft
  prometheus:
    metrics:
      export:
        enabled: true

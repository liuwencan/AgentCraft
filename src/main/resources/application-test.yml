server:
  port: 8888
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true
spring:
  reactor:
    context-propagation: auto
  ai:
    model:
      chat: openai
    openai:
      api-key: @dashscope.api.key@
      base-url: https://dashscope.aliyuncs.com/compatible-mode/
      chat:
        options:
          model: MiniMax-M2.5
          temperature: 0.7
          maxTokens: 20000
      embedding:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/
        api-key: @dashscope.api.key@
        options:
          model: text-embedding-v4
          dimmension: 1024
    deepseek:
      api-key: @dashscope.api.key@
      base-url: https://dashscope.aliyuncs.com/compatible-mode/
      chat:
        options:
          model: deepseek-v3
          temperature: 0.7
          maxTokens: 5000
  datasource:
    url: jdbc:mysql://119.29.203.49:3306/dodo?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8 # 记得改成你自己的
    username: root # 记得改成你自己的
    password: qaz112233... # 记得改成你自己的
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接池配置
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 60000
      connection-timeout: 30000
      max-lifetime: 1800000

  # Redis 配置
  data:
    redis:
      host: 119.29.203.49   # 记得改成你自己的
      port: 6379
      database: 6
      timeout: 5s
      password: qaz112233...

  # MyBatis-Plus 配置
